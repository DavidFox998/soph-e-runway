[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soph-e-runway"
version = "0.1.0"
description = "SOPH-E: a trust-gated shopping agent on the Runway. Measured, not minted."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
